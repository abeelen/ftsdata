[tox]
min_version = 4.0
envlist =
    py{38,311,313,314}-test
    build_docs

[testenv]
description =
    run tests

pass_env =
    CI
    CC
    LOCALE_ARCHIVE
    LC_ALL

set_env =
    MPLBACKEND = agg

# Run the tests in a temporary directory to make sure that we don't import
# the package from the source tree
change_dir = .tmp/{envname}

deps =
    pytest-cov

extras =
    test

commands_pre =
    pip freeze

commands =
    pytest --pyargs ftsdata --cov ftsdata --cov-report xml:coverage.xml --cov-report term-missing {posargs}

[testenv:build_docs]
description = invoke sphinx-build to build the HTML docs
change_dir =
    docs
extras =
    docs
commands =
    sphinx-build -j auto --color -W --keep-going -b html -d _build/.doctrees . _build/html {posargs}
