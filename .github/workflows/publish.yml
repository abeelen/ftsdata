name: Publish

# Adapted from the OpenAstronomy packaging template and guide:
# https://packaging-guide.openastronomy.org/en/latest/ci.html#publishing-to-pypi
#
# The reusable workflow builds the sdist and the pure-Python wheel, installs
# the sdist in a clean virtual environment, runs the test suite and only
# uploads to PyPI for tags starting with "v" (its `upload_to_pypi` input
# defaults to "refs/tags/v").  Pushes to main and manual runs therefore
# exercise the whole release path without publishing anything.
#
# The `verify-version` job runs first and aborts the release when the version
# derived from the git history differs from the tag name.  That catches
# misplaced tags and, in particular, two release tags on the same commit,
# which makes `git describe` ambiguous.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-version:
    name: Check tag and version agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs the full history and the tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare the computed version with the tag
        # Always run this job (so that `publish` is never skipped), but only
        # compare for release tags; pushes to main are dry runs.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip install --quiet setuptools_scm
          version="$(python -m setuptools_scm)"
          expected="${GITHUB_REF_NAME#v}"
          echo "tag ${GITHUB_REF_NAME} -> version ${version}"
          if [ "${version}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolves to version ${version}; refusing to publish."
            echo "Give every release its own commit: never tag two versions on the same commit."
            exit 1
          fi

  publish:
    name: Build, test and publish
    needs: verify-version
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@v1
    with:
      # The test suite imports matplotlib, h5py, dask and psutil, so the
      # "all" extra is required on top of "test".
      test_extras: all,test
      test_command: pytest --pyargs ftsdata
      # Only used to build and test the distributions; the sdist and the wheel
      # are version agnostic (py3-none-any) so this does not restrict users.
      # Pinned rather than "3.x" because astropy/numpy wheels lag the newest
      # Python release.
      python-version: "3.13"
    secrets:
      # PyPI API token, stored as a repository (or organisation) secret.
      # Required for tag builds; without it the upload step fails.
      pypi_token: ${{ secrets.pypi_token }}
