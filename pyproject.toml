[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ftsdata"
version = "0.1.0"
description = "Fourier-transform spectrometer data containers, transforms, I/O and co-addition"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Alexandre Beelen", email = "alexandre.beelen@lam.fr"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # Python 3.8 is kept as an explicit exception for the CONCERTO environment;
    # newer versions follow the SPEC 0 floors.  See docs/source/min_versions.md.
    "numpy>=1.24.4; python_version < '3.9'",
    "numpy>=2.0.2; python_version >= '3.9' and python_version < '3.11'",
    "numpy>=2.3.0; python_version >= '3.11'",
    "scipy>=1.10.1; python_version < '3.9'",
    "scipy>=1.13.1; python_version >= '3.9' and python_version < '3.11'",
    "scipy>=1.15.0; python_version >= '3.11'",
    "astropy>=5.2.2; python_version < '3.9'",
    "astropy>=6.0.1; python_version >= '3.9' and python_version < '3.11'",
    "astropy>=7.0.0; python_version >= '3.11'",
]

[project.optional-dependencies]
hdf5 = ["h5py"]
dask = ["dask"]
plot = ["matplotlib"]
psutil = ["psutil"]
all = ["h5py", "dask", "matplotlib", "psutil"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "numpydoc>=1.5",
    "sphinx-copybutton",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=0.9",
    "matplotlib",
]

[project.urls]
Homepage = "https://gitlab.lam.fr/KISS/ftsdata"

[tool.setuptools.packages.find]
where = ["."]
include = ["ftsdata*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
