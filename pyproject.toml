[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ftsdata"
version = "0.1.0"
description = "Fourier-transform spectrometer data containers, transforms, I/O and co-addition"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    {name = "Alexandre Beelen", email = "alexandre.beelen@lam.fr"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.16.0",
    "scipy>=1.1.0",
    "astropy>=3.2.3",
]

[project.optional-dependencies]
hdf5 = ["h5py"]
dask = ["dask"]
plot = ["matplotlib"]
psutil = ["psutil"]
all = ["h5py", "dask", "matplotlib", "psutil"]

[project.urls]
Homepage = "https://gitlab.lam.fr/KISS/kidsdata"

[tool.setuptools.packages.find]
where = ["."]
include = ["ftsdata*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
