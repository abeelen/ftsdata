[build-system]
requires = [
    "setuptools>=62.1",
    "setuptools_scm[toml]>=8.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ftsdata"
dynamic = ["version"]
description = "Fourier-transform spectrometer data containers, transforms, I/O and co-addition"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.8"
license = { file = "licenses/LICENSE.rst" }
authors = [
    { name = "Alexandre Beelen", email = "alexandre.beelen@lam.fr" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    # Python 3.8 is kept as an explicit exception for the CONCERTO environment;
    # it is targeted for removal in 0.2.0.  Newer versions follow the SPEC 0
    # floors.  See docs/min_versions.md.
    "numpy>=1.24.4; python_version < '3.9'",
    "numpy>=2.0.2; python_version >= '3.9' and python_version < '3.11'",
    "numpy>=2.3.0; python_version >= '3.11'",
    "scipy>=1.10.1; python_version < '3.9'",
    "scipy>=1.13.1; python_version >= '3.9' and python_version < '3.11'",
    "scipy>=1.15.0; python_version >= '3.11'",
    "astropy>=5.2.2; python_version < '3.9'",
    "astropy>=6.0.1; python_version >= '3.9' and python_version < '3.11'",
    "astropy>=7.0.0; python_version >= '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
hdf5 = ["h5py"]
dask = ["dask"]
plot = ["matplotlib"]
psutil = ["psutil"]
all = ["h5py", "dask", "matplotlib", "psutil"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "numpydoc>=1.5",
    "sphinx-copybutton",
    "myst-parser>=3.0",
    "sphinxcontrib-mermaid>=0.9",
    "matplotlib",
]

[project.urls]
Homepage = "https://gitlab.lam.fr/KISS/ftsdata"
Repository = "https://gitlab.lam.fr/KISS/ftsdata"
Documentation = "https://ftsdata-7333b4.docs.lam.fr"
"GitHub Pages" = "https://abeelen.github.io/ftsdata/"
"Read the Docs" = "https://ftsdata.readthedocs.io/"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["ftsdata*"]

[tool.setuptools_scm]
version_file = "ftsdata/version.py"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = [
    "ftsdata/tests",
]
addopts = "-ra"

[tool.coverage.run]
omit = [
    "ftsdata/__init__*",
    "ftsdata/conftest.py",
    "ftsdata/tests/*",
    "ftsdata/version*",
    "*/ftsdata/__init__*",
    "*/ftsdata/conftest.py",
    "*/ftsdata/tests/*",
    "*/ftsdata/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main(.*):",
    "pragma: py{ignore_python_version}",
    "def _ipython_key_completions_",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
